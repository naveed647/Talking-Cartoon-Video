
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talking Cartoon Video Maker</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial;text-align:center}
header{background:#1d4ed8;padding:20px}
main{max-width:650px;margin:auto;padding:15px}
textarea,select{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;border-radius:8px;font-size:16px}
button{padding:12px;margin:5px;border:0;border-radius:8px;background:#38bdf8;font-weight:bold}
canvas{width:100%;max-width:600px;background:#bae6fd;border-radius:12px}
#status{color:#7dd3fc}
</style>
</head>
<body>
<header>
<h1>🎬 Cartoon Video Maker</h1>
<p>Create and record your cartoon story</p>
</header>
<main>
<textarea id="story" rows="3">Hello friends! Welcome to my cartoon story.</textarea>
<select id="character">
<option value="👦">Boy</option>
<option value="👧">Girl</option>
<option value="🐱">Cat</option>
<option value="🐰">Rabbit</option>
<option value="🤖">Robot</option>
</select>
<br>
<button onclick="preview()">Preview Cartoon</button>
<button onclick="speak()">Speak Story</button>
<br>
<canvas id="video" width="600" height="400"></canvas>
<br>
<button onclick="startRecording()">🔴 Start Video</button>
<button onclick="stopRecording()">⬇️ Stop & Download</button>
<p id="status">Ready to create your cartoon!</p>
<p>Video downloads as WebM. Speech audio is not included in the recording.</p>
</main>
<script>
const c=document.getElementById("video");
const ctx=c.getContext("2d");
let recorder, chunks=[], recording=false, frame=0;

function draw(){
ctx.clearRect(0,0,600,400);
let sky=ctx.createLinearGradient(0,0,0,400);
sky.addColorStop(0,"#7dd3fc");
sky.addColorStop(1,"#fef3c7");
ctx.fillStyle=sky;
ctx.fillRect(0,0,600,400);
ctx.fillStyle="#4ade80";
ctx.fillRect(0,300,600,100);
ctx.font="100px sans-serif";
ctx.textAlign="center";
ctx.fillText(document.getElementById("character").value,
300,245+Math.sin(frame/8)*10);
ctx.fillStyle="white";
ctx.fillRect(25,25,550,75);
ctx.fillStyle="#111827";
ctx.font="22px sans-serif";
let words=document.getElementById("story").value;
if(words.length>65) words=words.slice(0,62)+"...";
ctx.fillText(words,300,68);
frame++;
requestAnimationFrame(draw);
}
draw();

function preview(){
document.getElementById("status").textContent="Cartoon preview is running!";
}
function speak(){
let t=document.getElementById("story").value;
if(!t.trim()) return;
if(!("speechSynthesis" in window)){
document.getElementById("status").textContent="Speech is not supported in this browser.";
return;
}
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(t);
u.lang="en-US";
speechSynthesis.speak(u);
}
function startRecording(){
if(!c.captureStream||!window.MediaRecorder){
document.getElementById("status").textContent="Recording is not supported in this browser. Try Chrome.";
return;
}
if(recording)return;
chunks=[];
try{
let stream=c.captureStream(30);
let type=MediaRecorder.isTypeSupported("video/webm;codecs=vp8")?
"video/webm;codecs=vp8":"video/webm";
recorder=new MediaRecorder(stream,{mimeType:type});
recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
recorder.onstop=()=>{
let blob=new Blob(chunks,{type:"video/webm"});
let url=URL.createObjectURL(blob);
let a=document.createElement("a");
a.href=url;
a.download="cartoon-story.webm";
a.click();
setTimeout(()=>URL.revokeObjectURL(url),2000);
document.getElementById("status").textContent="Video downloaded!";
};
recorder.start();
recording=true;
document.getElementById("status").textContent="Recording... Tap Stop & Download when ready.";
}catch(e){
document.getElementById("status").textContent="Could not start recording. Try Chrome.";
}
}
function stopRecording(){
if(recorder&&recording){
recording=false;
recorder.stop();
document.getElementById("status").textContent="Preparing your video...";
}else{
document.getElementById("status").textContent="Start recording first.";
}
}
</script>
</body>
</html>
