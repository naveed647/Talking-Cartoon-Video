
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talking Cartoon Video Maker</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f0f5ff;
  padding: 15px;
}
canvas {
  width: 100%;
  max-width: 500px;
  background: #dff4ff;
  border: 2px solid #333;
  border-radius: 12px;
}
button, input {
  margin: 10px auto;
  padding: 12px;
  max-width: 100%;
}
button {
  background: #1769ff;
  color: white;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
}
#status { overflow-wrap: anywhere; }
</style>
</head>
<body>

<h2>🎬 Talking Cartoon Video Maker</h2>

<canvas id="screen" width="640" height="480"></canvas>

<p>1. Apni cartoon ki voice MP3/WAV file select karein:</p>
<input id="voiceFile" type="file" accept="audio/*">

<br>
<button id="preview">▶️ Voice Suno</button>
<button id="record">🎥 Video Banao</button>

<p id="status">Pehle voice file select karein.</p>
<audio id="voice" controls></audio>
<br>
<a id="download" hidden>⬇️ Download Cartoon Video</a>

<script>
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const voice = document.getElementById("voice");
const fileInput = document.getElementById("voiceFile");
const statusText = document.getElementById("status");
const download = document.getElementById("download");

let audioURL = null;
let animationId;

function drawCartoon(t = 0) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#dff4ff";
  ctx.fillRect(0, 0, 640, 480);

  // Sun
  ctx.fillStyle = "#ffd43b";
  ctx.beginPath();
  ctx.arc(550, 75, 38, 0, Math.PI * 2);
  ctx.fill();

  // Cartoon body
  ctx.fillStyle = "#2388e8";
  ctx.beginPath();
  ctx.ellipse(320, 365, 105, 90, 0, 0, Math.PI * 2);
  ctx.fill();

  // Face
  ctx.fillStyle = "#ffcc99";
  ctx.beginPath();
  ctx.arc(320, 215, 105, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = "#222";
  ctx.beginPath();
  ctx.arc(282, 190, 10, 0, Math.PI * 2);
  ctx.arc(358, 190, 10, 0, Math.PI * 2);
  ctx.fill();

  // Mouth moves while the video plays
  ctx.fillStyle = "#8b1e1e";
  ctx.beginPath();
  if (voice.paused || voice.ended) {
    ctx.ellipse(320, 258, 28, 7, 0, 0, Math.PI * 2);
  } else {
    const mouth = 8 + Math.abs(Math.sin(t / 90)) * 19;
    ctx.ellipse(320, 258, 27, mouth, 0, 0, Math.PI * 2);
  }
  ctx.fill();

  ctx.fillStyle = "#123";
  ctx.font = "bold 25px Arial";
  ctx.textAlign = "center";
  ctx.fillText("Hello Friends!", 320, 445);

  animationId = requestAnimationFrame(drawCartoon);
}
drawCartoon();

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (!file) return;

  if (audioURL) URL.revokeObjectURL(audioURL);
  audioURL = URL.createObjectURL(file);
  voice.src = audioURL;
  download.hidden = true;
  statusText.textContent = "Voice file ready. Ab Voice Suno ya Video Banao dabayein.";
});

document.getElementById("preview").addEventListener("click", async () => {
  if (!voice.src) {
    statusText.textContent = "Pehle voice ki MP3/WAV file select karein.";
    return;
  }
  try {
    voice.currentTime = 0;
    await voice.play();
  } catch (e) {
    statusText.textContent = "Voice play nahi hui. Dobara try karein.";
  }
});

document.getElementById("record").addEventListener("click", async () => {
  if (!voice.src) {
    statusText.textContent = "Pehle voice ki MP3/WAV file select karein.";
    return;
  }

  if (!canvas.captureStream || !window.MediaRecorder) {
    statusText.textContent = "Aapka browser video recording support nahi karta.";
    return;
  }

  try {
    download.hidden = true;
    statusText.textContent = "Video ban rahi hai. Is tab ko khula rakhein...";

    const audioContext = new AudioContext();
    await audioContext.resume();

    const source = audioContext.createMediaElementSource(voice);
    const destination = audioContext.createMediaStreamDestination();
    source.connect(destination);
    source.connect(audioContext.destination);

    const videoStream = canvas.captureStream(25);
    const combinedStream = new MediaStream([
      ...videoStream.getVideoTracks(),
      ...destination.stream.getAudioTracks()
    ]);

    const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")
      ? "video/webm;codecs=vp8,opus"
      : "video/webm";

    const recorder = new MediaRecorder(combinedStream, { mimeType });
    const chunks = [];

    recorder.ondataavailable = e => {
      if (e.data.size > 0) chunks.push(e.data);
    };

    recorder.onerror = () => {
      statusText.textContent = "Recording mein error aaya. Dobara try karein.";
    };

    recorder.onstop = async () => {
      const videoBlob = new Blob(chunks, { type: "video/webm" });
      const videoURL = URL.createObjectURL(videoBlob);

      download.href = videoURL;
      download.download = "talking-cartoon.webm";
      download.textContent = "⬇️ Download Cartoon Video";
      download.hidden = false;

      statusText.textContent = "Video tayyar hai! Download par tap karein.";

      combinedStream.getTracks().forEach(track => track.stop());
      await audioContext.close();
    };

    voice.onended = () => {
      if (recorder.state !== "inactive") recorder.stop();
    };

    voice.currentTime = 0;
    recorder.start();
    await voice.play();

  } catch (error) {
    statusText.textContent = "Recording shuru nahi hui. Page reload karke dobara try karein.";
  }
});
</script>
</body>
</html>
