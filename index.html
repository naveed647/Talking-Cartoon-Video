
<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urdu Talking Cartoon Maker</title>
<style>
body{font-family:Arial,sans-serif;background:#eef3ff;margin:0;padding:16px;text-align:center}
main{max-width:650px;margin:auto;background:white;padding:18px;border-radius:16px}
h1{color:#234b91;font-size:25px}
textarea{width:95%;height:120px;padding:10px;font-size:18px;border:1px solid #aaa;border-radius:10px}
button{padding:12px;margin:7px;border:0;border-radius:9px;background:#2454a6;color:white;font-size:16px}
canvas{width:100%;max-width:480px;background:#c9e9ff;border-radius:12px;margin-top:12px}
input{margin:12px;max-width:95%}
#status{color:#234b91}
</style>
</head>
<body>
<main>
<h1>🎬 اردو ٹاکنگ کارٹون</h1>
<p>اپنی کہانی لکھیں، آڈیو منتخب کریں اور کارٹون ویڈیو بنائیں۔</p>

<textarea id="story">ایک دن ایک شرارتی خرگوش بازار گیا۔ وہاں اسے ایک گاجر ملی۔ خرگوش خوشی سے ناچنے لگا، لیکن گاجر اس کے ہاتھ سے گر گئی!</textarea>

<br>
<button onclick="speakStory()">🔊 کہانی سنیں</button>

<p>اپنی کہانی کی آواز والی آڈیو فائل منتخب کریں:</p>
<input id="audioFile" type="file" accept="audio/*">

<br>
<canvas id="screen" width="640" height="360"></canvas>
<br>
<button onclick="startAnimation()">▶️ کارٹون چلائیں</button>
<button onclick="makeVideo()">🎥 ویڈیو بنائیں</button>
<p id="status">تیار ہے۔</p>
<audio id="audio" controls style="width:100%"></audio>
</main>

<script>
const canvas=document.getElementById("screen");
const ctx=canvas.getContext("2d");
const story=document.getElementById("story");
const audio=document.getElementById("audio");
const statusText=document.getElementById("status");
let running=false;
let frame=0;
let recording=false;

document.getElementById("audioFile").addEventListener("change",e=>{
 const file=e.target.files[0];
 if(file){
  audio.src=URL.createObjectURL(file);
  statusText.textContent="آڈیو منتخب ہوگئی۔";
 }
});

function speakStory(){
 if(!("speechSynthesis" in window)){
  alert("آپ کے براؤزر میں آواز کی سہولت دستیاب نہیں۔");
  return;
 }
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(story.value);
 utterance.lang="ur-PK";
 utterance.rate=0.85;
 speechSynthesis.speak(utterance);
}

function draw(){
 frame++;
 ctx.clearRect(0,0,640,360);
 ctx.fillStyle="#bfe8ff";
 ctx.fillRect(0,0,640,360);
 ctx.fillStyle="#79c96b";
 ctx.fillRect(0,285,640,75);

ctx.fillStyle="#ffdb9c";
ctx.beginPath();
ctx.arc(320,150+Math.sin(frame/8)*5,70,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#fff";
ctx.beginPath();ctx.arc(295,135,17,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(345,135,17,0,Math.PI*2);ctx.fill();

ctx.fillStyle="#222";
ctx.beginPath();ctx.arc(299,137,7,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(349,137,7,0,Math.PI*2);ctx.fill();

ctx.strokeStyle="#8c3c28";
ctx.lineWidth=5;
ctx.beginPath();
ctx.arc(320,165,25,0.15,Math.PI-0.15);
ctx.stroke();

ctx.fillStyle="#234b91";
ctx.font="bold 24px Arial";
ctx.textAlign="center";
ctx.fillText("میرا پیارا کارٹون",320,45);

ctx.fillStyle="#fff";
ctx.fillRect(25,300,590,48);
ctx.fillStyle="#111";
ctx.font="20px Arial";
let words=story.value;
if(words.length>55) words=words.slice(0,55)+"…";
ctx.fillText(words,320,330);

if(running) requestAnimationFrame(draw);
}

draw();

function startAnimation(){
 running=true;
 draw();
 statusText.textContent="کارٹون چل رہا ہے۔";
}

async function makeVideo(){
 if(recording)return;
 if(!window.MediaRecorder || !canvas.captureStream){
  alert("ویڈیو ریکارڈنگ اس براؤزر میں دستیاب نہیں۔ Chrome میں کوشش کریں۔");
  return;
 }
 if(!audio.src){
  alert("پہلے کہانی کی آواز والی آڈیو فائل منتخب کریں۔");
  return;
 }

 try{
  recording=true;
  running=true;
  draw();

  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  const audioContext=new AudioContextClass();
  await audioContext.resume();

  const source=audioContext.createMediaElementSource(audio);
  const destination=audioContext.createMediaStreamDestination();
  source.connect(destination);
  source.connect(audioContext.destination);

  const videoStream=canvas.captureStream(25);
  destination.stream.getAudioTracks().forEach(track=>videoStream.addTrack(track));

  const mimeType=MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")
   ?"video/webm;codecs=vp8,opus":"video/webm";
  const recorder=new MediaRecorder(videoStream,{mimeType});
  const chunks=[];

  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{
   const blob=new Blob(chunks,{type:"video/webm"});
   const url=URL.createObjectURL(blob);
   const link=document.createElement("a");
   link.href=url;
   link.download="urdu-cartoon.webm";
   link.textContent="⬇️ ویڈیو ڈاؤن لوڈ کریں";
   link.style.display="block";
   link.style.margin="15px";
   document.querySelector("main").appendChild(link);
   statusText.textContent="ویڈیو تیار ہے!";
   videoStream.getTracks().forEach(t=>t.stop());
   audioContext.close();
   recording=false;
  };

  audio.currentTime=0;
  recorder.start();
  await audio.play();
  audio.onended=()=>{if(recorder.state!=="inactive")recorder.stop()};
  statusText.textContent="ویڈیو بن رہی ہے، آڈیو ختم ہونے تک انتظار کریں۔";
 }catch(error){
  recording=false;
  statusText.textContent="مسئلہ آیا۔ آڈیو دوبارہ منتخب کرکے کوشش کریں۔";
  alert("ویڈیو نہیں بن سکی۔ آڈیو فائل اور Chrome کی اجازتیں چیک کریں۔");
 }
}
</script>
</body>
</html>
